<!-- ════════════ ZONE À MODIFIER (page « Événements ») ════════════════════════════════
     Deux choses à éditer ici :

     1) Les TEXTES DE PAGE (titre, intro, en-têtes « À venir » / « Passés »), en 3 langues.

     2) Les TROIS LISTES d'évènements (EVENTS.el / .en / .fr) — le MÊME évènement dans
        les 3 langues (traduit). Pour CHAQUE évènement :
            statut: upcoming   (à venir)   ou   past   (passé, va dans l'historique)
            date:   Mercredi 22 juillet 2026 · 19h
            titre:  (obligatoire)
            photo:  (facultatif — fichier dans assets/, ex. photo: events/plage-arriere.jpg)
        Puis, EN DESSOUS, le TEXTE libre (un ou plusieurs paragraphes séparés par une
        ligne vide). On sépare deux évènements par une ligne contenant seulement  ---
        • Après un évènement : passer son  statut:  de  upcoming  à  past  (dans les 3 langues).
        • Pas de photo ?  = enlever la ligne « photo: », une carte de repli s'affiche.
        ⚠️ Ne pas toucher aux repères  el: `   en: `   fr: `   ni aux  ` (accent grave).
     ═══════════════════════════════════════════════════════════════════════════════════ -->
<script>

  back_home:      { el:"Πίσω στην αρχική", en:"Back to home", fr:"Retour à l'accueil" },

  nav_books:      { el:"Βιβλία",        en:"Books",        fr:"Livres" },

  nav_road:       { el:"Για τον δρόμο", en:"For the road", fr:"Pour la route" },
  nav_events:     { el:"Εκδηλώσεις",     en:"Events",       fr:"Événements" },
  nav_find:       { el:"Πού είμαστε",   en:"Find us",      fr:"Nous trouver" },
  events_label:   { el:"Πρόγραμμα", en:"What's on", fr:"À l'affiche" },
  events_title:   { el:"Εκδηλώσεις", en:"Events", fr:"Événements" },
  events_intro:   {
    el:"Συναντήσεις, αναγνώσεις και παρουσιάσεις βιβλίων στο βιβλιοπωλείο. Τι έρχεται — και τι έχει ήδη γίνει.",
    en:"Encounters, readings and book launches at the bookshop. What's coming — and what has already taken place.",
    fr:"Rencontres, lectures et présentations à la librairie. Ce qui vient — et ce qui a déjà eu lieu." },

  events_upcoming:{ el:"Προσεχώς", en:"Upcoming", fr:"À venir" },
  events_past:    { el:"Περασμένες", en:"Past", fr:"Passés" },

  lightbox_close: { el:"Κλείσιμο", en:"Close", fr:"Fermer" },
  foot_tagline:   { el:"Ένα μικρό βιβλιοπωλείο στην Ίο", en:"A small bookshop on Ios", fr:"Une petite librairie à Ios" }
};

const EVENTS = {
  el: `
statut: upcoming
date: Τετάρτη 22 Ιουλίου 2026 · 19:00
titre: Η Mildred Simantov παρουσιάζει το «Plage arrière»
photo: events/plage-arriere.jpg

Η Γαλλίδα συγγραφέας Mildred Simantov παρουσιάζει το μυθιστόρημά της «Plage arrière» (εκδ. Les Corps conducteurs), η δράση του οποίου εκτυλίσσεται εν μέρει στη Σίκινο, το μικρό νησί ακριβώς απέναντι από την Ίο. Σας περιμένουμε στο βιβλιοπωλείο.

Η παρουσίαση θα γίνει στα γαλλικά.
`,

  en: `
statut: upcoming
date: Wednesday 22 July 2026 · 7pm
titre: Mildred Simantov presents "Plage arrière"
photo: events/plage-arriere.jpg

French author Mildred Simantov presents her novel "Plage arrière" (Les Corps conducteurs), partly set on Sikinos, the little island just across from Ios. Join us at the bookshop.

The talk will be in French.
`,

  fr: `
statut: upcoming
date: Mercredi 22 juillet 2026 · 19h
titre: Mildred Simantov présente « Plage arrière »
photo: events/plage-arriere.jpg

L'écrivaine française Mildred Simantov présente son roman « Plage arrière » (éditions Les Corps conducteurs), dont l'action se déroule en partie à Sikinos, la petite île qui fait face à Ios. Rendez-vous à la librairie.

La présentation se fera en français.
`
};

const INSTAGRAM_URL = "https://www.instagram.com/demodocos.books.ios/";
const DEFAULT_LANG = "en";
</script>

<script src="site.js"></script>
<script>
/* Rendu de la liste des évènements (propre à cette page — ne touche pas à site.js partagé).
   Lit la liste de la langue courante dans EVENTS, sépare « à venir » / « passés », écrit les
   fiches, réagit au toggle EL/EN/FR. La lightbox est ouverte par délégation ; sa fermeture
   est déjà gérée par site.js. */
(function(){
  "use strict";
  const LANGS = ["el","en","fr"];
  const ZOOM  = { el:"Μεγέθυνση", en:"Enlarge", fr:"Agrandir" };

  function curLang(){
    try { const s = localStorage.getItem("demodocos-lang"); if(LANGS.includes(s)) return s; } catch(e){}
    const n = (navigator.language||"").slice(0,2).toLowerCase();
    if(LANGS.includes(n)) return n;
    return (typeof DEFAULT_LANG !== "undefined") ? DEFAULT_LANG : "en";
  }
  function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function photoSrc(p){ return /^(https?:|\/)/.test(p) ? p : "assets/" + p; }
  function heading(key, lang){
    const c = (typeof CONTENT !== "undefined" && CONTENT[key]) ? CONTENT[key] : null;
    return c ? (c[lang] || c.en || "") : "";
  }

  // Un bloc = champs « statut/date/titre/photo » + le reste = texte (paragraphes séparés par une ligne vide).
  function parseList(txt){
    return (txt||"").split(/^\s*---\s*$/m).map(block => {
      const o = { paras: [] };
      const textLines = [];
      block.split(/\r?\n/).forEach(line => {
        const m = line.match(/^\s*(statut|date|titre|photo)\s*:\s*(.*)$/i);
        if(m) o[m[1].toLowerCase()] = m[2].trim();
        else textLines.push(line);
      });
      o.paras = textLines.join("\n").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      return o;
    }).filter(o => o.titre);
  }

  function eventRow(b, lang){
    const t = esc(b.titre), d = esc(b.date || "");
    const cover = b.photo
      ? '<div class="cover"><button type="button" class="zoom" data-zoom aria-label="' + esc(ZOOM[lang]) + ' : ' + t + '">'
          + '<img src="' + esc(photoSrc(b.photo)) + '" alt="' + t + '" loading="lazy"></button></div>'
      : '<div class="cover is-fallback" aria-hidden="true"><img src="assets/livre-demodocos.png" alt=""></div>';
    const comment = b.paras.map(p => '<p>' + esc(p) + '</p>').join("");
    return '<article class="eventrow">' + cover
      + '<div class="eventmeta">'
      + (d ? '<p class="event-date">' + d + '</p>' : '')
      + '<h3>' + t + '</h3>'
      + (comment ? '<div class="comment">' + comment + '</div>' : '')
      + '</div></article>';
  }

  function renderEvents(lang){
    const wrap = document.getElementById("eventlist");
    if(!wrap || typeof EVENTS === "undefined") return;
    const list = parseList(EVENTS[lang] || EVENTS.en || "");
    const upcoming = list.filter(e => (e.statut||"").toLowerCase() !== "past");
    const past     = list.filter(e => (e.statut||"").toLowerCase() === "past");
    let html = "";
    if(upcoming.length){
      html += '<div class="event-group"><p class="event-group-title">' + esc(heading("events_upcoming", lang)) + '</p>'
            + upcoming.map(e => eventRow(e, lang)).join("") + '</div>';
    }
    if(past.length){
      html += '<div class="event-group is-past"><p class="event-group-title">' + esc(heading("events_past", lang)) + '</p>'
            + past.map(e => eventRow(e, lang)).join("") + '</div>';
    }
    wrap.innerHTML = html;
  }

  function wireLightbox(){
    const wrap = document.getElementById("eventlist");
    const lb   = document.getElementById("lightbox");
    if(!wrap || !lb) return;
    const img = document.getElementById("lightbox-img");
    const closeBtn = document.getElementById("lightbox-close");
    wrap.addEventListener("click", e => {
      const btn = e.target.closest("[data-zoom]"); if(!btn) return;
      const im = btn.querySelector("img"); if(!im) return;
      img.src = im.currentSrc || im.src; img.alt = im.alt || "";
      lb.classList.add("open"); document.body.style.overflow = "hidden";
      if(closeBtn) closeBtn.focus();
    });
  }

  function init(){
    renderEvents(curLang());
    wireLightbox();
    document.querySelectorAll(".langs button").forEach(b => {
      b.addEventListener("click", () => renderEvents(b.dataset.lang));
    });
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
