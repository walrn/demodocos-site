<style>
  /* Page « Pour la route » : section « Livres » (couverture + commentaire, comme books.html)
     puis section « Carnets » (grille d'images, sans légende). Scopé à la page. */
  .road-sec{margin-top:clamp(52px,8vw,92px)}
  .sec-title{font-family:var(--display);font-weight:600;color:var(--ink);
    font-size:clamp(1.5rem,3vw,2rem);line-height:1.1;margin:0 0 clamp(24px,3.4vw,38px);
    padding-bottom:.42em;border-bottom:1px solid var(--line)}

  /* boutons de zoom communs aux deux sections */
  .road-sec .zoom{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;line-height:0}

  /* —— Livres —— */
  .guides{display:flex;flex-direction:column;gap:clamp(44px,6.5vw,76px);max-width:860px}
  .guide{display:grid;grid-template-columns:200px 1fr;gap:clamp(24px,3.6vw,44px);align-items:start}
  .guide .covers{margin:0;display:flex;flex-direction:column;gap:14px}
  .guide .covers img{display:block;width:100%;height:auto;border:1px solid var(--line)}
  .guide .gtext h3{font-size:1.5rem;line-height:1.16;margin:0}
  .guide .gtext .byline{font-size:.95rem;color:var(--text);opacity:.8;margin:.35em 0 0;letter-spacing:.02em}
  .guide .comment{margin-top:.95em}
  .guide .comment p{font-size:1.12rem;line-height:1.56;margin:0;color:var(--text)}
  .guide .map-strip{grid-column:1/-1;margin:.4em 0 0}
  .guide .map-strip img{display:block;width:100%;height:auto;border:1px solid var(--line)}
  @media(max-width:640px){
    .guide{grid-template-columns:1fr;gap:18px}
    .guide .covers{max-width:220px}
    .guide .covers.two{flex-direction:row;max-width:none}
  }

  /* —— Carnets —— */
  .carnets{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2.4vw,26px);max-width:900px}
  .carnets figure{margin:0;min-width:0}
  .carnets img{display:block;width:100%;height:auto;border:1px solid var(--line)}
  @media(max-width:820px){ .carnets{grid-template-columns:repeat(3,1fr)} }
  @media(max-width:520px){ .carnets{grid-template-columns:repeat(2,1fr)} }
</style>
