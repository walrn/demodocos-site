<link rel="stylesheet" href="styles.css">
<style>
  /* La modale d'explication s'ouvre de DEUX façons (toutes deux branchées sur .js-logo-open) :
     (1) le lien visible « Notre logo → » en bas à gauche du porteur de rame — comme en prod,
         mais MASQUÉ sous le breakpoint mobile (là où il tombait près de l'eyebrow et cassait
         la lecture) ;
     (2) le porteur de rame lui-même, via un bouton transparent qui le couvre — reste le moyen
         d'ouvrir la modale sur mobile. (Scopé ici ; à porter dans styles.css.) */
  .figure-stage .logo-wrap{position:relative;width:min(330px,80%);margin-inline:auto;line-height:0;cursor:pointer}
  .figure-stage .logo-wrap svg.fig{width:100%;transition:opacity .2s}
  .figure-stage .logo-wrap:hover svg.fig{opacity:.82}   /* léger repli au survol → indique le clic */
  @media(max-width:680px){ .figure-stage .logo-wrap{width:min(220px,56%)} }
  /* (2) bouton transparent couvrant tout le logo — grande cible, déclencheur accessible partout */
  .logo-btn{position:absolute;inset:0;z-index:3;margin:0;padding:0;background:none;border:0;cursor:pointer}
  .logo-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:4px}
  .logo-btn .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}   /* libellé lecteurs d'écran, invisible */
  /* (1) lien visible en bas à gauche (identique à la prod), masqué sur mobile */
  .logo-link{position:absolute;left:0;bottom:-1.6em;z-index:4;
    background:none;border:0;cursor:pointer;padding:0;
    font-family:var(--body);text-transform:uppercase;letter-spacing:.18em;font-size:.62rem;
    color:var(--ink);opacity:.6;white-space:nowrap}
  .logo-link::after{content:" \2192"}
  .logo-link:hover{opacity:1}
  @media(max-width:780px){ .logo-link{display:none} }

  dialog.logo-modal{box-sizing:border-box;width:92vw;max-width:560px;max-height:86vh;
    border:0;padding:0;background:var(--wash);color:var(--text);border-radius:6px;
    overflow:hidden;box-shadow:0 24px 70px rgba(10,46,99,.32)}
  dialog.logo-modal::backdrop{background:rgba(10,46,99,.55)}
  /* filigrane : rattaché au dialog (reste fixe pendant que le texte défile) */
  .logo-modal .mark{position:absolute;right:clamp(8px,3vw,24px);bottom:0;
    width:min(58%,240px);height:auto;opacity:.08;pointer-events:none;z-index:0}
  /* .inner = zone défilable (le texte défile DANS la fenêtre) */
  .logo-modal .inner{box-sizing:border-box;position:relative;z-index:1;
    max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:clamp(26px,5vw,52px)}
  .logo-modal .body{position:relative}
  .logo-modal .label{display:block;margin-bottom:.7em}
  .logo-modal h2{font-size:clamp(1.5rem,3.2vw,2rem);margin:0 0 .6em}
  .logo-modal .txt{font-size:1.06rem;line-height:1.6;max-width:44ch;margin:0;
    overflow-wrap:break-word;text-align:justify;hyphens:auto}
  .logo-modal .gloss{margin:.9em 0 0;font-size:.86rem;font-style:italic;
    line-height:1.5;color:var(--text);opacity:.7}
  .logo-modal .gloss:empty{display:none}
  .logo-modal .close{position:absolute;top:10px;right:14px;z-index:2;background:none;border:0;
    font-size:1.9rem;line-height:1;color:var(--ink);cursor:pointer;opacity:.6;padding:.1em .2em}
  .logo-modal .close:hover{opacity:1}
  @media(max-width:520px){
    .logo-modal .txt{font-size:.94rem;line-height:1.58}
    .logo-modal h2{font-size:1.4rem}
  }

  /* Bandeau « évènement de la semaine » : sous l'en-tête, cliquable → events.html.
     Pile centrée IDENTIQUE mobile/laptop (aucun CSS séparé par taille) : eyebrow (quasi-noir)
     + titre (Playfair 600, cobalt, agrandi) + date. (Scopé ici ; à porter dans styles.css.) */
  .event-banner{display:block;background:var(--wash);border-bottom:1px solid var(--line);
    color:var(--ink);text-decoration:none;font-family:var(--body)}
  .event-banner[hidden]{display:none}
  .event-banner .eb-inner{display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:.28em;padding-top:14px;padding-bottom:14px}
  .event-banner .eb-eyebrow{text-transform:uppercase;letter-spacing:.24em;font-size:.74rem;
    font-weight:600;color:var(--text)}
  .event-banner .eb-text{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.24;
    color:var(--ink)}
  .event-banner .eb-meta{display:inline-flex;align-items:center;gap:.55em;
    font-size:.92rem;letter-spacing:.02em;color:var(--text);opacity:.9}
  .event-banner .eb-arrow{transition:transform .2s}
  .event-banner:hover .eb-text{text-decoration:underline;text-underline-offset:3px}
  .event-banner:hover .eb-arrow{transform:translateX(3px)}
</style>

<script>
/* Bandeau évènement : masqué s'il n'y a pas de texte (semaine sans évènement), y compris
   après un changement de langue (site.js réécrit le texte au clic sur EL/EN/FR). */
(function(){
  var b = document.getElementById("event-banner");
  if(!b) return;
  var t = b.querySelector(".eb-text");
  function upd(){ if(t && t.textContent.trim()) b.removeAttribute("hidden"); else b.setAttribute("hidden",""); }
  upd();
  document.querySelectorAll(".langs button").forEach(function(btn){
    btn.addEventListener("click", function(){ setTimeout(upd, 0); });
  });
})();
</script>
<script>
/* Modale « Notre logo » (propre à l'accueil). <dialog> natif : ouverture au clic sur le
   logo lui-même OU sur le lien « Notre logo » (tous deux .js-logo-open), fermeture par la
   croix, l'Échap (natif) ou un clic sur le fond.
   On verrouille le défilement de la page derrière la fenêtre (sinon, sur iOS, c'est la
   page complète qui défile) ; le texte, lui, défile dans .inner. */
(function(){
  "use strict";
  var dlg = document.getElementById("logo-modal");
  var triggers = document.querySelectorAll(".js-logo-open");
  var close = document.getElementById("logo-close");
  if(!dlg || !triggers.length) return;
  var root = document.documentElement;
  function lock(){ root.style.overflow = "hidden"; }
  function unlock(){ root.style.overflow = ""; }
  triggers.forEach(function(el){
    el.addEventListener("click", function(){
      if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
      lock();
    });
  });
  if(close) close.addEventListener("click", function(){ dlg.close(); });
  // clic sur le fond (backdrop) : la cible est le <dialog> lui-même
  dlg.addEventListener("click", function(e){ if(e.target === dlg) dlg.close(); });
  // rétablir le défilement quelle que soit la façon de fermer (croix, Échap, fond)
  dlg.addEventListener("close", unlock);
})();
</script>
